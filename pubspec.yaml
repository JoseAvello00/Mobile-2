name: fastmob
description: "FastMob: aplicativo de mobilidade urbana (passageiro)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  fastmob_design_system:
    path: packages/design_system
  http: ^1.6.0
  # Free map (OpenStreetMap tiles, no API key) and coordinates.
  flutter_map: ^8.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
